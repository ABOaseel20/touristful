<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tourism in Saudi Arabia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        body {
            font-family: 'Arial', sans-serif;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s;
        }

        .slide.active {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-[#3b2f2f] text-white">

    <!-- Header -->
    <header class="bg-gradient-to-r from-[#8b6b2e] to-[#c9a24d] p-6 flex justify-between">
        <h1 class="text-xl font-bold">🌴 Saudi Tourism</h1>
        <nav class="space-x-4">
            <a href="#home">Home</a>
            <a href="#places">Places</a>
        </nav>
    </header>

    <!-- Slider -->
    <section id="home" class="relative h-[70vh]">
        <img src="aloula.jpg" class="slide active">
        <img src="taif.jpg" class="slide">
        <img src="Tabuk.jpg" class="slide">
        <img src="Madina.jpg" class="slide">
        <img src="jeddah.jpg" class="slide">
    </section>

    <!-- Places -->
    <section id="places" class="p-10 grid md:grid-cols-3 gap-6">

        <div>
            <img src="aloula.jpg">
            <h3>AlUla</h3>
        </div>

        <div>
            <img src="images/tabuk.jpg">
            <h3>Tabuk</h3>
        </div>

        <div>
            <img src="images/jeddah.jpg">
            <h3>Jeddah</h3>
        </div>

        <div>
            <img src="riyadh.jpg">
            <h3>Riyadh</h3>
        </div>

        <div>
            <img src="asir.jpg">
            <h3>Asir</h3>
        </div>

        <div>
            <img src="madina.jpg">
            <h3>Madinah</h3>
        </div>

        <div>
            <img src="taif.jpg">
            <h3>Taif</h3>
        </div>

    </section>

    <script>
        const slides = document.querySelectorAll('.slide');
        let i = 0;

        setInterval(() => {
            slides[i].classList.remove('active');
            i = (i + 1) % slides.length;
            slides[i].classList.add('active');
        }, 3000);
    </script>

</body>
</html>
